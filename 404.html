<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | K.O. Onditi</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
.not-found {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
}
.not-found-num {
  font-family: 'EB Garamond', serif;
  font-size: 140px;
  font-weight: 700;
  color: var(--faint);
  line-height: 1;
  letter-spacing: -6px;
}
.not-found h1 {
  font-family: 'EB Garamond', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--cream);
  margin: 16px 0 8px;
}
.not-found p {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 40px;
}
</style>
</head>
<body>
<div class="not-found">
  <div class="not-found-num">404</div>
  <h1>Page not found</h1>
  <p>The specimen you're looking for has wandered off-transect</p>
  <a href="index.html" class="btn-primary">← Return Home</a>
</div>
</body>
</html>
