name: Check website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r assets/_maintenance/requirements.txt
      - run: python -m unittest discover -s assets/_maintenance -p 'test_*.py'
      - run: node assets/_maintenance/test_homepage_metrics.cjs
      - run: node assets/_maintenance/test_publications.cjs
      - run: node assets/_maintenance/test_citations.cjs
      - run: python assets/_maintenance/check_site.py
      - run: python assets/_maintenance/refresh_static.py --check
