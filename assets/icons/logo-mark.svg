<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Stylised rodent skull / academic mark -->
  <circle cx="16" cy="13" r="7" stroke="#c8943a" stroke-width="1.2" fill="none"/>
  <!-- Eye sockets -->
  <circle cx="13" cy="11.5" r="2" stroke="#c8943a" stroke-width="1" fill="none"/>
  <circle cx="19" cy="11.5" r="2" stroke="#c8943a" stroke-width="1" fill="none"/>
  <!-- Snout line -->
  <line x1="16" y1="18" x2="16" y2="22" stroke="#c8943a" stroke-width="1"/>
  <!-- Incisors -->
  <rect x="14.3" y="21.5" width="1.4" height="3" rx="0.5" stroke="#c8943a" stroke-width="0.8" fill="none"/>
  <rect x="16.3" y="21.5" width="1.4" height="3" rx="0.5" stroke="#c8943a" stroke-width="0.8" fill="none"/>
  <!-- DNA helix motif on sides -->
  <path d="M 6 6 C 8 9, 6 12, 8 15" stroke="#5a8c6a" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 8 6 C 6 9, 8 12, 6 15" stroke="#5a8c6a" stroke-width="0.8" fill="none" opacity="0.7"/>
  <line x1="6.5" y1="8.5" x2="7.5" y2="9" stroke="#5a8c6a" stroke-width="0.6" opacity="0.7"/>
  <line x1="6.5" y1="12.5" x2="7.5" y2="11.5" stroke="#5a8c6a" stroke-width="0.6" opacity="0.7"/>
</svg>
